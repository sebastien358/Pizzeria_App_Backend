nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            - 'http://localhost:3000'
            - 'http://localhost:5173'
            - 'http://127.0.0.1:3000'
            - '%env(CORS_ALLOW_ORIGIN)%'
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        allow_credentials: true
        max_age: 3600
    paths:
        '^/': ~
